[cybersyn2-combinator-modes-labels]
signal=Signal
signal-inputs=Signal inputs
signal-outputs=Signal outputs
value=Value
effect=Effect
flags=Flags
settings=Settings
deprecated=Deprecated

[cybersyn2-combinator-mode-deprecated]
desc=This combinator mode is deprecated. Please consult the documentation for details on potential replacements for your use case.

[cybersyn2-combinator-mode-station]
cargo=Cargo
cargo-tooltip=Determines whether deliveries can pick up, drop off, or both. Setting the switch to the center position allows both inbound and outbound deliveries.
cargo-outbound-only=Outbound only
cargo-inbound-only=Inbound only
default-item-network=Default item network
primary-input-wire=Primary input wire
red=Red
green=Green
network=Default item network
network-tooltip=The default item network for this station. All requests and provides will be made on this network unless overridden by the specific requesting or providing order.
provide-all=Auto provide all
provide-all-tooltip=If checked, this station will provide its entire inventory when in provide mode. If unchecked, provided inventory must be given explicitly.
true-inventory-signals=Set the station's true inventory. The true inventory is the positive gross value of all cargo present at this station. [font=default-bold]Required for basic operation.[/font]
priority-signal=Set the default priority for all orders at this station.
order-signals=Sets cargo orders. [font=default-bold]Negative[/font] signals indicate requested cargo. [font=default-bold]Positive[/font] signals indicate provided cargo.
auto-mds=Auto minimum delivery size (percent)
auto-mds-tooltip=If checked, this station will automatically calculate inbound delivery sizes as a percent of requested amounts.
auto-mds-percent-tooltip=Percentage (1-100) of requested amount to use as minimum delivery size.
topology=Topology
topology-tooltip=Manually assign this station to a specific topology by placing a virtual signal here. Leaving blank will assign the station to the default topology associated to the station's surface.

cargo-switch-tooltip=Determines whether deliveries can pick up, drop off, or both.
status-shared-none=No shared inventory
status-shared-master=Sharing my inventory
status-shared-slave=Receiving shared inventory
thresholds=Thresholds
depletion-threshold=Depletion threshold
depletion-threshold-tooltip=Percentage of any requested item that must be missing before a delivery is triggered.\n\nNOTE: All thresholds are hints to the system and may not be strictly enforced.
fullness-threshold=Train fullness threshold
fullness-threshold-tooltip=Percentage of total train cargo capacity that should be filled before a delivery will be made.\n\nNOTE: All thresholds are hints to the system and may not be strictly enforced.
fullness-when-providing=Enforce train fullness threshold when providing
fullness-when-providing-tooltip=If checked, this station will only provide deliveries that meet the train fullness threshold set at this station. This means that even if a request threshold is met, a train will not depart unless it is sufficiently full.\n\nIf unchecked, only request thresholds apply as usual.
allow-list=Allow List
allow-strict=Strict allow list
allow-strict-tooltip=Requires all equipment at the train stop to engage with a wagon.
allow-bidi=Bidirectional trains only
allow-bidi-tooltip=Requires trains that can travel in both directions; both directions must also be compatible with the stop equipment
allow-all=Allow all trains
allow-all-tooltip=If checked, this station will allow any train to use it regardless of station layout. In order to further control which trains come to this station, you must use networks.
departure-conditions=Departure Conditions
allow-departure-signal=Signal: Allow departure
allow-departure-signal-tooltip=Trains will only depart if this signal is present at the train stop.\n\nNOTE: The train stop must be set to send signals to the train.
force-departure-signal=Signal: Force departure
force-departure-signal-tooltip=If this signal is present at the train stop, the train will be forced to leave, regardless of other conditions.\n\nNOTE: The train stop must be set to send signals to the train.
inactivity-mode=Inactivity mode
inactivity-mode-tooltip=Determines how the inactivity timer will apply. After delivery means the train will wait the appropriate number of seconds after emptying its cargo. Force out means the train will be forced out after the appropriate number of seconds, regardless of whether it has emptied its cargo. The center position disables inactivity timeouts.
inactivity-mode-after-delivery=After delivery
inactivity-mode-force-out=Force out
inactivity-timeout=Inactivity timeout (sec)
cargo-condition=Enable cargo condition
cargo-condition-tooltip=If checked, trains will receive a wait condition requiring them to pick up or drop off their cargo. If unchecked, you must manually control the train's departure using custom logic.
outbound-item-handling=Outbound Item Handling
spillover=Spillover
spillover-tooltip=A number of extra items (measured in units, not stacks) that may be loaded into each cargo wagon of an outgoing train as a result of imprecise processes such as extra inserter swings. This value is applied per-item against the capacity of the each wagon and the net inventory of the station.
reserved-slots=Reserved slots per cargo wagon
reserved-slots-tooltip=The number of slots that will be deducted for each cargo wagon when calculating the capacity of an outgoing train. Unlike spillover, reserve slots do not count against the net inventory of the station.
reserved-capacity=Reserved capacity per fluid wagon
reserved-capacity-tooltip=A reserved amount of capacity to be deducted per fluid wagon. This can be used to allow pumps to clear their fluid boxes before a train departs.
single-item=Single item per outgoing train
single-item-tooltip=If checked, this station will never load multiple items onto an outgoing train, instead loading only the first matching item.
shared-inventory=Shared Inventory
stop-sharing=Stop sharing inventory
start-sharing=Share this inventory with another station
clone-orders=Clone orders
clone-orders-tooltip=If checked, this station will ignore its own orders and clone identical orders from the master station.
circuit-configuration=Configuration via Circuit
signal-depletion=Input signal: Depletion percentage
signal-depletion-tooltip=The value of this signal on the primary input wire will be used as the depletion percentage for deliveries rather than the setting in the combinator.
signal-fullness=Input signal: Train fullness percentage
signal-fullness-tooltip=The value of this signal on the primary input wire will be used as the train fullness percentage for deliveries rather than the setting in the combinator.
signal-reserved-slots=Input signal: Reserved slots per cargo wagon
signal-reserved-slots-tooltip=The value of this signal on the primary input wire will be used as the number of reserved slots per cargo wagon rather than the setting in the combinator.
signal-reserved-fluid=Input signal: Reserved capacity per fluid wagon
signal-reserved-fluid-tooltip=The value of this signal on the primary input wire will be used as the reserved capacity per fluid wagon rather than the setting in the combinator.
signal-spillover=Input signal: Spillover
signal-spillover-tooltip=The value of this signal on the primary input wire will be used as the spillover rather than the setting in the combinator.

[cybersyn2-combinator-mode-manifest]
desc=Outputs the [font=default-bold]manifest[/font] of the parked train in the form of item and fluid signals. The manifest reflects the desired cargo of the train, and may be different than the actual cargo.
output-signals=Cargo and quantities of this train's manifest. [font=default-bold]Positive[/font] signals indicate items the train is dropping off. [font=default-bold]Negative[/font] signals indicate items the train is picking up.
signal-dropoff=Signal: Dropping off
tooltip-dropoff=If the parked train is dropping off cargo, this signal will be set to a value of 1 in the output.
signal-pickup=Signal: Picking up
tooltip-pickup=If the parked train is picking up cargo, this signal will be set to a value of 1 in the output.
network-signal=Network signal
tooltip-network-signal=If checked, the order's network signal will be added to the output signals.

[cybersyn2-combinator-mode-delivery-size]
stacks=Stacks
stacks-tooltip=For non-fluid cargo inputs, measures input quantities in stacks.
desc=Stations will not receive deliveries below their [font=default-bold]delivery size[/font]. Delivery sizes apply to each item separately.
cargo-inputs=Set delivery size for individual cargo at this station. Each cargo's delivery size will be set to its signal value.
all-items=Set delivery size for all items at this station.\n[font=default-bold]NOTE:[/font] This value is always measured in stacks regardless of the Stacks setting!
all-fluids=Set checked sizes for all fluids at this station.

[cybersyn2-combinator-mode-wagon-split]
desc=At a provider station, generates a special manifest for each wagon, splitting cargo evenly between them.\n\nAt a requester station, outputs the actual cargo content of each wagon at the time it arrived.\n\nTo access this data, build a wagon split combinator next to each wagon. Each combinator outputs the described data of the nearest wagon in the form of item and fluid signals.
output-signals=Cargo and quantities of this wagon's manifest. [font=default-bold]Positive[/font] signals indicate items to be dropped off by the wagon. [font=default-bold]Negative[/font] signals indicate items to be loaded into the wagon.

[cybersyn2-combinator-mode-inventory]
desc=Provides additional cargo orders for this station. The [font=default-bold][color=red]red[/color][/font] and [font=default-bold][color=green]green[/color][/font] input wires are treated as two additional independent cargo orders.
network-signals-each=Any nonzero virtual signals will be used as networks. The value of the signal will be used as the bitmask.
network-signals-specific=Set the bitmask for this order's network.
priority-signal=Sets the priority for this order. Greater values indicate higher priority.
all-items-signal=A negative value on this signal causes all available items to be requested. The value is interpreted as the number of free item slots in this station's storage.
all-fluids-signal=A negative value on this signal causes all available fluids to be requested. The value is interpreted as the amount of free fluid storage capacity at this station.
and=AND
or=OR

[cybersyn2-combinator-mode-deliveries]
desc=Outputs the sum of the manifests of [font=default-bold]all deliveries[/font] to and/or from this station in the form of item and fluid signals.
output-signals=Net cargo and quantities of all delivery manifests. [font=default-bold]Positive[/font] signals indicate items to be dropped off. [font=default-bold]Negative[/font] signals indicate items to be picked up.
include-inbound=Include dropoffs
include-inbound-tooltip=If checked, the sum of all inbound deliveries to this station will be included in the output.
include-outbound=Include pickups
include-outbound-tooltip=If checked, the sum of all outbound deliveries from this station will be included in the output.

[cybersyn2-combinator-mode-surface]
desc=Outputs the [font=default-bold]total inventory[/font] available on the surface where the combinator resides.
output-signals=Total cargo and quantities available on the entire surface for the selected inventory category.
output-mode=Output mode
provided=Provided
pulled=Pulled
pushed=Pushed
sunk=Sunk

[cybersyn2-combinator-mode-allow]
desc=The [font=default-bold]allow list[/font] determines which trains can be sent to this station. This combinator mode lets you create and manage manual allow lists.\n\nThe layout of a train is given as a Factorio rich text string of items representing the carriages of the train from front to back.
manual-allow-list=Manual allow list
remove-selected=Remove selected layout
no-layouts=No allowed layouts. Use the input box or dropdown\nto add layouts to the allow list.
allowed-layouts=Allowed layouts:
add-existing-layout=Add existing layout:
add-custom-layout=Add custom layout:
invalid-layout-string=[color=red]Invalid layout string.[/color]
custom-layout-tooltip=Enter a rich text string representing the layout of the train you want to allow, from front to back. For example, [item=locomotive][item=fluid-wagon] [item=cargo-wagon] would represent a train with a locomotive, followed by a fluid wagon, followed by a cargo wagon. You can use any item that would represent a train wagon, including modded wagons.
existing-layout-tooltip=Select from the layouts of known Cybersyn 2 trains to add that layout directly to the allow list.
group-config-header=Allow group
select-group=Group:
select-group-tooltip=Combinators that share a group name share one allow list. Editing the allow list of one combinator of a group edits it for all of them.\n\nChoose [font=default-bold]No group[/font] to give this combinator its own local allow list. It keeps the layouts it currently has.
no-group-option=No group (local allow list)
group-name-label=Group name:
group-name-tooltip=Press [font=default-bold]Enter[/font] to join the group of this name, creating it from the layouts of this combinator if the save has no group of this name yet.\n\nPress [font=default-bold]Ctrl + Enter[/font] to rename the group of this combinator. If a group with the new name exists, this group is merged into it.
groups-desc=\n\n[font=default-bold]Allow groups[/font] let several combinators share one allow list. The layouts belong to the group rather than to the combinators, so editing the allow list of one combinator of a group edits it for all of them.\n\nCreate a group by typing a new name and pressing [font=default-bold]Enter[/font]. Join a group by choosing it in the dropdown or typing its name and pressing [font=default-bold]Enter[/font]; the combinator adopts the layouts of the group. Rename the group of this combinator with [font=default-bold]Ctrl + Enter[/font].

[cybersyn2-combinator-orders]
order-settings=Order settings
red=Red
green=Green
wire=wire
item-network=Item network
item-network-tooltip=The item network for this order.\n\nIf set to the [virtual-signal=signal-each] 'Each' virtual signal, all input virtual signals will be treated as item networks, and their values will be used as netmasks.
network-matching-mode=Network matching mode
network-matching-mode-tooltip=Determines how network matching is performed for this order.\n\n[font=default-bold]OR[/font]: If the requesting order has any networks in common with the providing order, it is considered a match.\n[font=default-bold]AND[/font]: The requesting order must share ALL of its networks with the providing order to be considered a match.\n\nThe requesting order always determines the network matching mode.
reservation-type=Reservation type
reservation-type-tooltip=Controls how provider stock is reserved when this order cannot be fulfilled.\n\n[font=default-bold]All[/font]: Reserve all applicable stock.\n[font=default-bold]Scaled[/font]: Reserve a portion based on the time since this order was last fulfilled.\n[font=default-bold]Dump[/font]: Do not reserve stock; flag this station as a dump or byproduct requester\n[font=default-bold]None[/font]: Do not reserve stock.
reservation-all=All
reservation-scaled=Scaled
reservation-dump=Dump
reservation-none=None
flags=Flags
stacked-requests=Stacked requests
stacked-requests-tooltip=If checked, all requests will be interpreted as stacks of items rather than item counts.
round-to-stacks=Round deliveries to full stacks
round-to-stacks-tooltip=When checked, item quantities in deliveries for this order will be rounded down to the nearest full stack. Quantities of less than one stack will not be delivered. This does not apply to fluids or exotic orders.

[cybersyn2-combinator-mode-wagon-contents]
desc=Reads the inventory of the attached [font=default-bold]cargo wagon[/font] in real time. This is done in a UPS-efficient way using a proxy inventory.\n\nThe attached cargo wagon is the one parked at the track to which this combinator is connected.
output-signals=Current inventory of the attached cargo wagon.

[cybersyn2-combinator-mode-presence]
desc=Detects the parked locomotive or wagon in front of the combinator.
value-item=The item signal of the detected carriage. Value is 1, or the carriage index if enabled.
value-locomotive=Set when a locomotive is detected. Value is 1, or the carriage index if enabled.
value-cargo-wagon=Set when a cargo wagon is detected. Value is 1, or the carriage index if enabled.
value-fluid-wagon=Set when a fluid wagon is detected. Value is 1, or the carriage index if enabled.
value-empty=Set when nothing is detected. Value is 1.
item-signal=Output item signal
item-signal-tooltip=If checked, this combinator will also output the item signal of the detected carriage.
carriage-index=Use carriage index as signal value
carriage-index-tooltip=If checked, signal output values will match the carriage index of the wagon in the train.
signal-locomotive=Locomotive signal
tooltip-locomotive=This signal will be output if a locomotive is present.
signal-cargo-wagon=Cargo wagon signal
tooltip-cargo-wagon=This signal will be output if a cargo wagon is present.
signal-fluid-wagon=Fluid wagon signal
tooltip-fluid-wagon=This signal will be output if a fluid wagon is present.
signal-empty=Empty signal
tooltip-empty=This signal will be output if no carriage is present.
